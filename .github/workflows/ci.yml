name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24.20.0"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Audit dependency graph
        run: |
          vp env exec corepack pnpm peers check
          vp pm audit --production
          vp pm audit
          vp pm audit -- signatures

      - name: Validate
        run: vp run ci

  desktop-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24.20.0"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Package Electron application
        run: vp run package

      - name: Configure Chromium sandbox
        run: |
          sudo chown root:root out/norafold-linux-x64/chrome-sandbox
          sudo chmod 4755 out/norafold-linux-x64/chrome-sandbox

      - name: Run packaged application smoke test
        run: xvfb-run --auto-servernum vp run test:e2e
