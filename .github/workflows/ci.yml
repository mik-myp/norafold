name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24.20.0"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Audit dependency graph
        run: |
          pnpm peers check
          pnpm audit --prod
          pnpm audit
          pnpm audit signatures

      - name: Validate
        run: vp run ci

  desktop-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24.20.0"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Package Electron application
        run: vp run package

      - name: Run packaged application smoke test
        run: xvfb-run --auto-servernum vp run test:e2e
