name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: "24.20.0"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Validate
        run: vp run ci
