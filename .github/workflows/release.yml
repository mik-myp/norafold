name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.X.X exactly." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24.20.0"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Audit and validate
        run: |
          pnpm peers check
          pnpm audit --prod
          pnpm audit
          pnpm audit signatures
          vp run ci

  build:
    name: Build (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24.20.0"
          cache: true

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Apply tag version
        run: vp run release:version "$GITHUB_REF_NAME"
        shell: bash

      - name: Make platform artifacts
        run: vp run make

      - name: Run packaged application smoke test
        if: runner.os != 'Linux'
        run: vp run test:e2e

      - name: Run packaged application smoke test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum vp run test:e2e

      - name: Upload platform artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi
          gh release create "$TAG" "${files[@]}" --generate-notes --verify-tag
