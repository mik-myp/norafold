allowBuilds:
  "@swc/core": false
  electron: true
  electron-winstaller: true
  fs-xattr: true
  macos-alias: true
auditConfig:
  # maker-dmg -> appdmg only processes repository-controlled build assets, and
  # image-size has no patched release yet. Remove these once upstream updates.
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
blockExoticSubdeps: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
nodeLinker: hoisted
overrides:
  extract-zip: npm:@electron-internal/extract-zip@1.0.5
  tar: 7.5.21
  tmp: 0.2.7
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
